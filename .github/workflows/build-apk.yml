name: Build APK

# Builds a debug APK on every push, and lets you trigger it manually
# from the Actions tab (useful when you just want a fresh build).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzutyiUI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
